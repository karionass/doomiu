# Всё приложение одной командой:  docker compose up --build
# Фронт: http://localhost:5173   API: http://localhost:8000   Админка: http://localhost:8000/admin/
x-backend: &backend
  build: ./backend
  restart: unless-stopped
  environment: &backend-env
    DJANGO_DEBUG: "0"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-secret-key-before-deploying-0123456789}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    DB_NAME: mindful
    DB_USER: mindful
    DB_PASSWORD: ${DB_PASSWORD:-mindful}
    DB_HOST: db
    CELERY_BROKER_URL: redis://redis:6379/0
    # Почта: по умолчанию письма пишутся в логи (docker compose logs worker).
    EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
    EMAIL_HOST: ${EMAIL_HOST:-}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Mindful <noreply@mindful.local>}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindful
      POSTGRES_USER: mindful
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindful}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindful -d mindful"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    <<: *backend
    ports: ["8000:8000"]

  worker:  # отправка email-напоминаний (задачу ставит beat каждую минуту)
    <<: *backend
    command: celery -A config worker -l info

  beat:
    <<: *backend
    command: celery -A config beat -l info

  frontend:
    build:
      context: ./mindful
      args:
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
